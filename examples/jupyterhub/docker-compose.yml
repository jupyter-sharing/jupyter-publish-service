# Two SEPARATE services, two SEPARATE images:
#
#   hub     -> stock `jupyterhub/jupyterhub` image (the identity provider).
#              We do NOT install this package into it; hub_config.py falls
#              back to a hardcoded scope string when the package is absent.
#   publish -> slim image built from this repo (the publishing service).
#
# They are coupled only by (a) a shared service API token and (b) the Hub's
# REST API URL — exactly the contract a real deployment uses.
#
# Usage:
#   docker compose up --build            # start hub + publish
#   docker compose --profile demo run --rm demo    # run the two-user demo
#   docker compose down -v               # tear everything down
#
# Tokens default to obvious demo values below; override them with a .env file
# (see .env.example) for anything beyond a laptop.
name: jupyter-publishing-demo

services:
  # --- Identity provider: stock JupyterHub, unmodified image ----------------
  hub:
    image: jupyterhub/jupyterhub:5
    command:
      - jupyterhub
      - --config=/srv/jupyterhub/hub_config.py
      - --ip=0.0.0.0
      - --port=8000
    volumes:
      - ./hub_config.py:/srv/jupyterhub/hub_config.py:ro
    environment:
      # Shared with the publishing service; registers the `publish` service.
      PUBLISH_SERVICE_API_TOKEN: ${PUBLISH_SERVICE_API_TOKEN:-demo00000000000000000000000000000000000000000000000000000service}
      # Pre-minted demo user tokens (see hub_config.py).
      ALICE_TOKEN: ${ALICE_TOKEN:-demo0000000000000000000000000000000000000000000000000000000alice}
      BOB_TOKEN: ${BOB_TOKEN:-demo000000000000000000000000000000000000000000000000000000000bob}
    ports:
      - "8000:8000"
    healthcheck:
      # The Hub REST API answering means it is ready to validate tokens.
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/hub/api'')"',
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  # --- The publishing service: slim image built from this repo --------------
  publish:
    build:
      context: ../..
      dockerfile: examples/jupyterhub/Dockerfile
    image: jupyter-publishing:demo
    environment:
      # Read by publishing_config.py (note the underscore after JUPYTER).
      # Routed through the Hub's public proxy port; /hub/* reaches the Hub API.
      JUPYTER_HUB_API_URL: http://hub:8000/hub/api
      # HubAuthenticator/HubUserStore use this as the service-owned token.
      JUPYTERHUB_API_TOKEN: ${PUBLISH_SERVICE_API_TOKEN:-demo00000000000000000000000000000000000000000000000000000service}
      # The lab-local authority needs some JWKS URL at construction; the demo
      # never exercises it, so a placeholder is fine.
      LAB_JWKS_URL: ${LAB_JWKS_URL:-https://idp.example.com/.well-known/jwks.json}
    depends_on:
      hub:
        condition: service_healthy
    ports:
      - "9000:9000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:9000/'')"',
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  # --- One-shot: the two-user sharing demo (opt in with --profile demo) -----
  demo:
    image: jupyter-publishing:demo
    profiles: ["demo"]
    command: ["python3", "/src/examples/jupyterhub/demo.py"]
    environment:
      PUBLISH_URL: http://publish:9000
      DEMO_AUTHORITY: hub-local
      ALICE_TOKEN: ${ALICE_TOKEN:-demo0000000000000000000000000000000000000000000000000000000alice}
      BOB_TOKEN: ${BOB_TOKEN:-demo000000000000000000000000000000000000000000000000000000000bob}
    depends_on:
      publish:
        condition: service_healthy
